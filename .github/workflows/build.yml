name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # secrets can't be read in a step-level `if`; evaluate here and gate on the env flag
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android platform 35 + build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore release keystore (maintainer secrets; forks fall back to a debug key)
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KS_B64" | base64 -d > keystore/lyriq-release.jks
      - name: Build
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'lyriqwidget' }}
        run: BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0" ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lyriq-battery-widget
          path: build/out/lyriq-battery-widget.apk
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/out/lyriq-battery-widget.apk
